<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カレンダーのテスト</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h3>カレンダーのテスト</h3>



<div class="date_wrapper">
  <label for="purchaseDate">日付</label>

  <div class="date_field">

    <!-- 年月日を入力・選択する -->
    <input
      type="date"
      id="purchaseDate"
      name="purchaseDate"
      aria-label="年月日を入力または選択">

    <!-- 未入力時の表示 -->
    <span
      id="datePlaceholder"
      class="date_placeholder"
      aria-hidden="true">
      年 / 月 / 日
    </span>

    <!-- カレンダーアイコン -->
    <img
      class="calendar_icon"
      src="calender-icon.svg"
      width="24"
      height="24"
      alt="">

  </div>

  <p id="dateError" class="invalid" hidden></p>
  <p id="savedDate"></p>
</div>




  
  <input type="date" id="aaa" class="test" aria-label="カレンダーから日付を選択">
</body>
</html>
