<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カレンダーのテスト</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h3>カレンダーのテスト</h3>
  <div class="date_wrapper">
    <label for="purchaseDateText">日付</label>
    <div class="date_field">
      <input type="text" id="purchaseDateText" name="purchaseDateText"
             class="date_text" inputmode="text" autocomplete="off"
             maxlength="14" aria-describedby="dateError" >
      <span class="date_mask" aria-hidden="true">
        <span id="maskTyped"></span><span id="maskRest" class="date_mask_rest">年 / 月 / 日</span>
      </span>
      <!-- 外部SVGが不要なように、カレンダーアイコンを埋め込み -->
      <svg class="calendar_icon" width="24" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M7 3v4M17 3v4M3 10h18"/>
      </svg>
      <input type="date" id="purchaseDate" class="date_picker"
             aria-label="カレンダーから日付を選択" tabindex="-1">
    </div>
    <p class="invalid" id="dateError" role="status" aria-live="polite" hidden></p>
    <p class="saved_date" id="savedDate" aria-live="polite"></p>
  </div>
</body>
</html>
