<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>カレンダーのテスト</title>
  <link rel="stylesheet" href="style.css?v=20261009-1">
</head>
<body>

<h3>カレンダーのテスト</h3>

<div class="date_wrapper">
  <label for="dateText">日付</label>

  <div class="date_field">

    <!-- 手入力用 -->
    <input
      type="text"
      id="dateText"
      name="purchaseDateText"
      class="date_text"
      inputmode="numeric"
      autocomplete="off"
      maxlength="14"
      aria-label="年月日を手入力">

    <!-- 未入力部分の表示 -->
    <span class="date_mask" aria-hidden="true">
      <span id="maskTyped"></span>
      <span id="maskRest"
            class="date_mask_rest">年 / 月 / 日</span>
    </span>

    <!-- カレンダーアイコン -->
    <img
      class="calendar_icon"
      src="calender-icon.svg"
      width="24"
      height="24"
      alt="">

    <!-- iPhone標準カレンダー -->
    <input
      type="date"
      id="purchaseDate"
      class="date_picker"
      aria-label="カレンダーから日付を選択"
      tabindex="-1">

  </div>

  <p id="dateError" class="invalid" hidden></p>
</div>

<script src="script.js"></script>

</body>
</html>




</body>
